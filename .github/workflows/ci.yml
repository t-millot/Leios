name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    # Leios deploys to macOS 27, so the tests need a macOS 27 host to launch on.
    # `xcode-27` is GitHub's macOS 27 preview image; it can queue longer than the GA images.
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      # The workspace, not the project: Xcode leaves a local package's test targets out of a plain
      # project scheme, so `-project` would silently run only LeiosTests.
      # Signing is ad-hoc — CI has no Developer ID, and nothing under test needs a real identity
      # (the helper's XPC team check only bites in Release builds, which this isn't).
      - name: Run tests
        run: |
          set -o pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            formatter=(xcbeautify --renderer github-actions)
          else
            formatter=(cat)
          fi
          xcodebuild test \
            -workspace Leios.xcworkspace \
            -scheme Leios \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO \
            | "${formatter[@]}"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7

  lint:
    name: SwiftLint
    # Not on the runner image, unlike SwiftFormat and xcbeautify.
    # The baseline was tuned on 0.65.1; a SwiftLint that adds default rules will show up here as a
    # lint failure rather than a build failure, so adjust .swiftlint.yml when it does.
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftLint
        run: |
          brew install swiftlint
          swiftlint version

      # --strict: the tree is clean, so every warning is something this change introduced.
      # Rules the Mac Mouse Fix port does not fit are relaxed in Packages/LeiosKit/.swiftlint.yml.
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  format:
    name: SwiftFormat
    # Preinstalled on the image (0.63.0, the version the config was tuned against). A newer
    # SwiftFormat may add rules; when the image updates, this job is where that shows up.
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Show SwiftFormat version
        run: swiftformat --version

      # --lint reports what formatting would change without writing anything. The tree is clean,
      # so any report is from the change under test. Rules the port does not fit are relaxed in
      # .swiftformat and Packages/LeiosKit/.swiftformat.
      - name: Check formatting
        run: |
          swiftformat \
            Leios LeiosHelper LeiosTests \
            Packages/LeiosKit/Sources Packages/LeiosKit/Tests \
            --lint --reporter github-actions-log

  build-release:
    name: Release build
    # Independent of the tests: Release compiles whole-module and drops NS assertions, so it can
    # fail where the Debug test build passes. Nothing here is distributable — the product is
    # ad-hoc signed, and in Release the helper rejects XPC connections without a team identifier.
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Build app and helper
        run: |
          set -o pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            formatter=(xcbeautify --renderer github-actions)
          else
            formatter=(cat)
          fi
          xcodebuild build \
            -project Leios.xcodeproj \
            -scheme Leios \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            | "${formatter[@]}"

      # The Embed Helper and Copy LaunchAgent phases are only exercised by a full app build, and
      # AppBundleLayoutTests checks them for Debug only.
      - name: Check the Release bundle is laid out correctly
        run: |
          app=DerivedData/Build/Products/Release/Leios.app
          test -d "$app/Contents/Library/LoginItems/LeiosHelper.app"
          test -f "$app/Contents/Library/LaunchAgents/com.tmillot.Leios.Helper.plist"
          codesign --verify --deep --strict "$app"
