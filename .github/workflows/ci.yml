name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    # MousePilot deploys to macOS 27, so the tests need a macOS 27 host to launch on.
    # `xcode-27` is GitHub's macOS 27 preview image; it can queue longer than the GA images.
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      # The workspace, not the project: Xcode leaves a local package's test targets out of a plain
      # project scheme, so `-project` would silently run only MousePilotTests.
      # Signing is ad-hoc — CI has no Developer ID, and nothing under test needs a real identity
      # (the helper's XPC team check only bites in Release builds, which this isn't).
      - name: Run tests
        run: |
          set -o pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            formatter=(xcbeautify --renderer github-actions)
          else
            formatter=(cat)
          fi
          xcodebuild test \
            -workspace MousePilot.xcworkspace \
            -scheme MousePilot \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO \
            | "${formatter[@]}"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7

  build-release:
    name: Release build
    # Independent of the tests: Release compiles whole-module and drops NS assertions, so it can
    # fail where the Debug test build passes. Nothing here is distributable — the product is
    # ad-hoc signed, and in Release the helper rejects XPC connections without a team identifier.
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Build app and helper
        run: |
          set -o pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            formatter=(xcbeautify --renderer github-actions)
          else
            formatter=(cat)
          fi
          xcodebuild build \
            -project MousePilot.xcodeproj \
            -scheme MousePilot \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            | "${formatter[@]}"

      # The Embed Helper and Copy LaunchAgent phases are only exercised by a full app build, and
      # AppBundleLayoutTests checks them for Debug only.
      - name: Check the Release bundle is laid out correctly
        run: |
          app=DerivedData/Build/Products/Release/MousePilot.app
          test -d "$app/Contents/Library/LoginItems/MousePilotHelper.app"
          test -f "$app/Contents/Library/LaunchAgents/com.tmillot.MousePilot.Helper.plist"
          codesign --verify --deep --strict "$app"
